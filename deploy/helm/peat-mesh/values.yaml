replicaCount: 3

image:
  repository: peat-mesh-node
  tag: latest
  pullPolicy: IfNotPresent

# Base64-encoded formation secret (required)
formationSecret: ""

# Discovery mode: "kubernetes" or "mdns"
discoveryMode: kubernetes

# Broker HTTP/WS port
brokerPort: 8081

# Iroh QUIC port
irohBindPort: 11204

# Comma-separated Iroh relay URLs (optional)
irohRelayUrls: ""

# RUST_LOG filter
rustLog: "info,peat_mesh=debug"

# Automerge CRDT compaction (per-collection, sync-mode-aware)
# Only safe for LatestOnly sync-mode collections. Disabled by default.
compaction:
  enabled: false       # Set true to enable per-collection compaction
  intervalSecs: 300    # Sweep interval in seconds (minimum: 10)
  thresholdBytes: 65536  # Only compact documents larger than this (bytes)
  collections: ""      # Comma-separated collections (empty = auto-derive from LatestOnly sync modes)

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
